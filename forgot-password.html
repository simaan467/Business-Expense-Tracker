<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password | EarthNest Developers</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <h2>Reset Password</h2>
      <p>We will email a six-digit OTP to your registered address.</p>
      <form id="forgotForm">
        <div class="input-group"><label>Email address</label><input type="email" id="email" placeholder="Enter registered email" required /></div>
        <button type="submit" id="sendOtpButton">Send OTP</button>
      </form>
      <form id="resetForm" hidden>
        <div class="input-group"><label>OTP</label><input type="text" id="otp" inputmode="numeric" maxlength="6" placeholder="Six-digit OTP" required /></div>
        <div class="input-group"><label>New password</label><input type="password" id="newPassword" minlength="8" placeholder="At least 8 characters" required /></div>
        <button type="submit">Reset password</button>
      </form>
      <p id="resetMessage" class="success" aria-live="polite"></p>
      <div class="bottom-text"><a href="login.html">Back to sign in</a></div>
    </section>
  </main>
  <script src="forgot-password.js"></script>
</body>
</html>
