<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n-title="dashboard.title">EarthNest Developers Dashboard</title>
  <link rel="stylesheet" href="styles.css?v=20260920dashboard-layout" />
</head>
<body>
  <div class="app-shell">
  <header class="hero-banner">

      <div class="header-row">

          <div class="dashboard-brand">
            <img class="dashboard-brand-logo" src="assets/earthnest-developers-logo.png" alt="EarthNest Developers logo" />
            <h1 class="dashboard-title">Welcome to EarthNest Developers</h1>
          </div>

          <nav class="nav-pills" data-i18n-aria-label="common.navPrimary" aria-label="Primary">
              <a class="nav-pill is-active" href="index.html">Dashboard</a>
              <a class="nav-pill" href="projects.html">Projects</a>
          </nav>

          <a class="notification-icon" id="dashboardApprovalNotifications" href="projects.html?section=list" aria-label="Pending approvals" title="Pending approvals">
              <span aria-hidden="true">🔔</span>
              <span class="notification-count" id="dashboardApprovalCount" hidden>0</span>
          </a>

          <label class="language-switcher">
              <span>Language</span>
              <select data-language-switcher>
                  <option value="en">English</option>
                  <option value="hi">Hindi</option>
                  <option value="kn">Kannada</option>
                  <option value="ta">Tamil</option>
                  <option value="te">Telugu</option>
              </select>
          </label>

          <button id="logoutBtn">
              Logout
          </button>

      </div>

  </header>

    <section class="stat-grid" data-i18n-aria-label="common.overview" aria-label="Overview">
      <article class="stat-card">
        <span class="stat-label" data-i18n="common.investors">Investors</span>
        <strong id="statInvestorCount">0</strong>
        <small data-i18n="dashboard.investorCaption">Available to assign across projects</small>
      </article>

      <article class="stat-card">
        <span class="stat-label" data-i18n="common.projects">Projects</span>
        <strong id="statProjectCount">0</strong>
        <small data-i18n="dashboard.projectCaption">Each opens on its own page</small>
      </article>

    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <span class="eyebrow eyebrow-soft" data-i18n="common.directory">Directory</span>
          <h2 data-i18n="dashboard.projectPagesTitle">Project Pages</h2>
        </div>
      </div>

      <div class="project-grid" id="projectDirectory"></div>
    </section>
  </div>
  <div id="dashboardRequestToast" class="request-success-toast" role="status" aria-live="polite" hidden>
    <span aria-hidden="true">✓</span><span id="dashboardRequestToastText">Your request has been submitted.</span>
  </div>
  <script src="logout.js"></script>
  <script src="common.js?v=20260530a"></script>
  <script src="dashboard.js?v=20260920deletion-requests"></script>
</body>
</html>
