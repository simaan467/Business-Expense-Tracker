<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit my name | EARTH NEST DEVELOPERS</title>
  <link rel="stylesheet" href="styles.css?v=20261004profile-pages" />
  <script src="auth-guard.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="hero-banner hero-banner-projects">
      <div class="hero-copy"><span class="eyebrow">Profile</span><h1>Edit my name</h1><p>Update the name shown on your account and project memberships.</p></div>
      <div class="hero-actions"><a class="nav-pill" href="index.html">Dashboard</a><button id="logoutBtn">Logout</button></div>
    </header>
    <main class="panel profile-page-panel">
      <div class="panel-head"><div><span class="eyebrow eyebrow-soft">Account</span><h2>Your name</h2></div></div>
      <form id="profileNameForm" class="profile-form">
        <label class="field"><span>Name</span><input id="profileName" name="name" maxlength="80" required autocomplete="name" /></label>
        <div class="action-row"><button id="saveProfileButton" type="submit">Save name</button><a class="button-link button-secondary" href="index.html">Cancel</a></div>
      </form>
      <p id="profileNameStatus" class="helper-text" role="status" aria-live="polite"></p>
    </main>
  </div>
  <div id="profileNameToast" class="request-success-toast" role="status" aria-live="polite" hidden>
    <span aria-hidden="true">✓</span><span id="profileNameToastText">Your name has been updated.</span>
  </div>
  <script src="logout.js"></script>
  <script src="common.js?v=20261009brand-refresh"></script>
  <script src="profile-name.js?v=20261004"></script>
</body>
</html>
