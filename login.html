<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h2>Welcome Back 👋</h2>

        <p>Login to your account</p>

        <form id="loginForm">

            <div class="input-group">

                <label>Mobile Number</label>

                <input
                    type="text"
                    id="mobile"
                    placeholder="Enter Mobile Number"
                    required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required>

            </div>

            <div class="forgot">

                <a href="forgot-password.html">
                    Forgot Password?
                </a>

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="signup">

            New User?

            <a href="register.html">
                Sign Up
            </a>

        </div>

        <div class="bottom-text"><a href="welcome.html">Back to welcome</a></div>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
