<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EARTH NEST DEVELOPERS</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <script>
      const currentUser = localStorage.getItem("currentUser");
      const authToken = localStorage.getItem("authToken");

      // The dashboard performs the authoritative session check. Redirect even
      // when the short-lived access token has expired so it can be renewed
      // with the HttpOnly refresh cookie instead of showing a login prompt.
      if (currentUser && authToken) {
          window.location.replace("index.html");
      }
  </script>
  <main class="auth-container">
    <section class="auth-card welcome-card" aria-labelledby="welcomeTitle">
      <p class="brand-kicker">WELCOME TO</p>
      <h1 id="welcomeTitle">EARTH NEST DEVELOPERS</h1>
      <p>Manage projects, expenses, and transaction approvals in one place.</p>
      <div class="welcome-actions">
        <a class="auth-action primary-action" href="register.html">I’m new — Sign up</a>
        <a class="auth-action secondary-action" href="login.html">I already have an account — Sign in</a>
      </div>
    </section>
  </main>
</body>
</html>
